; LGP do NexusRO: marcações nas células do chão.
; Comandos do jogador: @lgp [on|off], @aoes [on|off], @circle [on|off], @square on|off|1-18
; (sem argumento, @lgp/@aoes/@circle alternam)
; As escolhas de cada jogador ficam em savedata\charselect\preferencias.ini, seção [lgp].
;
; Chaves "SkillXXXX": XXXX = tipo da unit em hexadecimal (UNT_* do rAthena).
; Exceção: 0010, 0011 e 0012 são as áreas marcadas no lançamento de
; Storm Gust, Meteor Storm e Lord of Vermilion (o servidor não manda units visíveis delas).
; Cores: 0xAARRGGBB (AA = opacidade). A cor multiplica a imagem (branco = cores originais).
; Skill com imagem e sem cor usa 0x7700FF00. Sem imagem e sem cor = não desenha.
; Imagens: pasta lgp\ (charselect\lgp\ no cliente ou data\charselect\lgp\ na char.grf);
; o magenta (FF00FF) é transparente.

[LGP]
; raio do anel do @circle, em células
raio_circulo = 9
; imagem das skills que têm cor mas não têm imagem própria em [LGP::CELL_IMAGE]
imagem_padrao = none_image.bmp

[LGP::LANCAMENTO]
; skills sem unit visível, marcadas quando são lançadas: id da skill (decimal) = chave da área (SkillXXXX)
; WZ_STORMGUST (Nevasca)
89 = 0010
; WZ_METEOR (Chuva de Meteoros)
83 = 0011
; WZ_VERMILION (Ira de Thor)
85 = 0012
; WZ_HEAVENDRIVE (Fúria da Terra)
91 = 0013

[LGP::AREA]
; SkillXXXX = raio em células[, tempo na tela em ms]  (padrões do servidor pré-renovação)
Skill0010 = 4, 4600
Skill0011 = 3, 1000
Skill0012 = 5, 4000
Skill0013 = 2, 1000
; Pneuma: só a célula do centro chega como unit de Pneuma
Skill0085 = 1

[LGP::CELL_FADE_OUT_TIME]
; SkillXXXX = ms para a marcação esmaecer até sumir (0 = sem esmaecer)
Skill0011 = 1000
Skill0013 = 1000

