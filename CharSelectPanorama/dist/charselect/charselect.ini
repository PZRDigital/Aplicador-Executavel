; Seleção de personagem panorâmica - NexusRO
; Esta pasta ("charselect") fica ao lado do Codex.exe, junto com o d3d9.dll.

[geral]
ativo=1
; debug=1 grava charselect\charselect.log com o diagnóstico das chamadas de desenho
debug=1
; replace = substitui o fundo em tela cheia desenhado pelo cliente (padrão)
; under   = desenha antes de tudo (use se o fundo do cliente for transparente)
; over    = desenha por cima de tudo (só para conferir se as imagens carregam)
modo=replace
; fração da tela que um desenho precisa cobrir para ser considerado "o fundo"
limite_tela_cheia=0.95
; opcional: identifica o fundo pelo tamanho da textura (veja o log), ex.: 1024x1024
textura_fundo=

[camera]
; onde o personagem selecionado fica na tela (fração a partir do centro; negativo = esquerda/acima)
enquadramento_x=-0.12
enquadramento_y=0.08
; tempo do deslize de câmera ao trocar de slot (ms)
transicao_ms=1400
; tempo do esmaecimento quando a próxima cena usa outra imagem (ms)
esmaecer_ms=500
; zoom extra com que uma imagem nova entra (0.06 = 6%)
aproximacao=0.06
; balanço ocioso da câmera (fração da imagem, 0 desativa)
balanco=0.004
; suavidade da camera ao trocar de personagem (segundos; maior = mais lenta)
suavidade=0.30
; afastamento (zoom out) no meio da troca (0 = desliga)
afastamento=0

[cenas]
; Formato: arquivo,focoX,focoY,zoom   (imagens em charselect\scenes\)
; "padrao" e o mapa do alojamento. Sem linha propria, a camera de cada slot
; desliza ate o personagem daquele slot (veja a secao de posicoes abaixo).
padrao=1@def02.jpg,0.50,0.50,1.35
; Opcional: cena fixa para um slot especifico (substitui o "seguir personagem")
;0=outra_cena.jpg,0.25,0.30,1.35

[posicoes]
; Onde cada personagem fica no mapa: slot=x,y (fracao da imagem, 0 a 1, nos pes).
; Calculado a partir das celulas andaveis do 1@def02 (plataformas de pedra e ilhas de grama).
0=0.500,0.501
1=0.370,0.270
2=0.557,0.285
3=0.612,0.517
4=0.407,0.764
5=0.581,0.764
6=0.351,0.501
7=0.470,0.301
8=0.645,0.332
9=0.640,0.656
10=0.456,0.733
11=0.295,0.254
12=0.425,0.501
13=0.667,0.748
14=0.361,0.393

[interface]
; interface nova no tema O Codex (0 = mostra a janela nativa do Ragnarok)
ativa=1
; página de código dos nomes dos personagens (1252 = português)
codigo_pagina=1252
; tamanho dos personagens no mapa (com o zoom padrão da câmera)
escala_personagem=1.4
; brilho dos personagens não selecionados (1 = normal)
brilho_outros=0.72
; tamanho do personagem na miniatura da lista
escala_miniatura=0.9
; 1 = amplia sem suavizar (pixel art nítido)
pixelado=1
; suavizacao das bordas dos personagens ampliados (0 = pixels nitidos, 1 = totalmente suave)
suavizar_sprites=0.3
; altura dos pés dentro do cartão nativo (px); ajuste se o personagem ficar cortado/deslocado
pe_no_cartao=146
; animacao do personagem selecionado: acao (32 = postura de combate, -1 = parado), ms por quadro,
; golpe ao pre-selecionar (40 = ataque, -1 = nunca) e repeticao (0 = so ao pre-selecionar)
acao_selecionado=32
quadro_ms=110
acao_golpe=40
intervalo_golpe_ms=0
; tempo (s) que o login-server espera a escolha do servidor de personagens (AUTH_TIMEOUT em src/login/login.hpp)
tempo_escolha_servidor_s=120

[nativo]
; Janela nativa escondida e seus botões (posição relativa ao canto da janela).
; A interface nova direciona os cliques para esses pontos.
janela=997x626
jogar=899,465
apagar=895,334
pagina_anterior=839,573
pagina_proxima=948,573
fechar=952,14
; moldura da tela de criação (cópia congelada da tela anterior), escondida
fundo_criacao=1028x768

[mapa3d]
; Mapa 3D de verdade (gerado por tools\mapa3d.py). 0 = usa as imagens de [cenas]
ativo=1
pasta=mapa3d\2@exds
; inclinacao da camera em graus acima do horizonte (menor = mais deitada, personagem mais de frente)
inclinacao=22
; distancia da camera ate o personagem e campo de visao (graus)
distancia=165
campo_visao=30
; altura do ponto observado acima dos pes
altura_alvo=14
; direcao base (graus; 0 = olhando para o norte do mapa)
direcao=0
; 0..1: quanto a camera gira para ficar do lado do centro olhando o personagem
orbita=0.6
; troca de personagem: arco (sobe/afasta no meio do caminho) e giro lateral em graus
arco=0.35
giro=8
; movimento ocioso (orbita lenta e respiracao; 0 = parada)
movimento_ocioso=1
; tamanho dos personagens no mundo (unidades por pixel do sprite)
unidades_por_pixel=0.19
; ceu noturno como no jogo (RGB hex) e nevoa (inicio,fim) na cor do horizonte
ceu_topo=05081A
ceu_horizonte=1E2A52
nevoa=450,1900
agua=0
; nuvens em volta da ilha: quantidade, altura media e tom (AARRGGBB; AA = opacidade maxima)
nuvens=45
altura_nuvens=-160
cor_nuvens=B08094D0
; estrelas, brilhos nos emissores do mapa (0 desliga) e halo do sol/lua (0 desliga)
estrelas=420
particulas=1
halo=1
; qualidade: renderiza o mapa em N vezes a resolucao e reduz (1 = desliga, 2 = recomendado)
superamostragem=2

[posicoes3d]
; celula do mapa (x,y como no /where do jogo) e direcao da camera (graus), calculadas por tools\posicoes3d.py
0=97,96,118
1=107,88,-154
2=89,105,66
3=107,102,-66
4=88,90,125
5=98,87,164
6=105,95,-152
7=86,97,99
8=99,103,36
9=92,99,93
10=94,91,129
11=94,107,45
12=102,90,-177
13=102,99,-115
14=90,94,116

[jogo]
; Escurecer/clarear da troca de mapa e do @refresh (original do cliente: 255 ms cada; 0 = sem fade)
duracao_fade_ms=0
